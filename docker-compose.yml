services:
  gail-breast-cancer-risk:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      AUDIT_SECRET_KEY: "${AUDIT_SECRET_KEY:?Set a unique AUDIT_SECRET_KEY in your environment}"
      GAIL_API_KEY: "${GAIL_API_KEY:?Set a unique GAIL_API_KEY in your environment}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
